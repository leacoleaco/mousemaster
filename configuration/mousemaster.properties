# mousemaster will automatically convert the key aliases to your current keyboard layout.
# However, if you want to make a change to the key aliases, and your keyboard layout
# is not us-qwerty, then remove .us-qwerty
# Double-tap this key (see idle-mode.double-tap-to-normal.*) to enter normal mode from idle.
key-alias.enabledoubletap.us-qwerty=capslock
key-alias.exit.us-qwerty=q p
key-alias.clickthendisable.us-qwerty=space
key-alias.up.us-qwerty=k
key-alias.down.us-qwerty=j
key-alias.left.us-qwerty=h
key-alias.right.us-qwerty=l
key-alias.edge.us-qwerty=rightalt
key-alias.wheelup.us-qwerty=e
key-alias.wheeldown.us-qwerty=d
key-alias.wheelleft.us-qwerty=u
key-alias.wheelright.us-qwerty=o
key-alias.leftbutton.us-qwerty=r g
key-alias.rightbutton.us-qwerty=t
key-alias.middlebutton.us-qwerty=0
key-alias.toggleleft.us-qwerty=n
key-alias.fast.us-qwerty=b
key-alias.slow.us-qwerty=v
key-alias.superslow.us-qwerty=leftshift
key-alias.grid.us-qwerty=y
key-alias.windowmod.us-qwerty=leftshift
key-alias.hint.us-qwerty=f
key-alias.hint2mod.us-qwerty=leftshift
key-alias.uihintmod.us-qwerty=leftshift
key-alias.screenselection.us-qwerty=c
key-alias.navigateback.us-qwerty=[
key-alias.navigateforward.us-qwerty=]
#key-alias.hint1key.us-qwerty=q w e r t a s d f g z x c v b y u i o p h j k l ; n m , . /
#key-alias.hint2key.us-qwerty=q w e r u i o p a s d f j k l ; z x c v m , . /
#key-alias.extendedhint1key.us-qwerty=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ; z x c v b n m , . /
#key-alias.extendedhint2key.us-qwerty=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ; z x c v b n m , . /
key-alias.hint1key.us-qwerty=q w e r a s d f z x c v
key-alias.hint2key.us-qwerty=q w e r a s d f z x c v
key-alias.extendedhint1key.us-qwerty=q w e r a s d f z x c v
key-alias.extendedhint2key.us-qwerty=q w e r a s d f z x c v
key-alias.hintscreenselectionkey.us-qwerty=j k l ; a s d f g
key-alias.arrowmod.us-qwerty=leftalt
key-alias.arrowkey.us-qwerty=up down left right

idle-mode.push-mode-to-history-stack=true
normal-mode.push-mode-to-history-stack=true

# Enter normal mode by double-tapping the enabledoubletap key (fast, within max-millis-between-taps).
# Optional: leading-debounce-millis avoids accidental re-trigger after the combo completes.
idle-mode.double-tap-to-normal.key-alias=enabledoubletap
idle-mode.double-tap-to-normal.max-millis-between-taps=400
idle-mode.double-tap-to-normal.leading-debounce-millis=200
idle-mode.double-tap-to-normal.target-mode=normal-mode

normal-mode.indicator.enabled=true
normal-mode.indicator.fill-color=#FF0000 | _{ismoving} -> #FF0000 | _{iswheeling} -> #FFFF00 | _{ismousepressing} -> #00FF00
# The following keys can be used to go back to idle mode:
# exit keys (q or p), click-then-disable key (space), leftctrl + f/l/e, f2, f3, /.
normal-mode.to.idle-mode=+exit | -clickthendisable \
  | _{leftctrl} #f | _{leftctrl} #l | _{leftctrl} #e | #f2 | #f3 | #/
normal-mode.mouse.initial-velocity=200
normal-mode.mouse.max-velocity=2200 | _{slow} ^{superslow} -> 350 | _{fast} -> 4500 | _{superslow} -> 75
normal-mode.mouse.acceleration=1000 | _{fast} -> 5000
normal-mode.wheel.initial-velocity=1500
normal-mode.wheel.max-velocity=2000 | _{slow} ^{superslow} -> 200 | _{fast} -> 10000 | _{superslow} -> 50
normal-mode.wheel.acceleration=500 | _{fast} -> 10000
# Start moving with direction keys.
# When releasing the edge key, if direction keys are already pressed then start moving.
# Also: hold capslock (enabledoubletap) + e/d/s/f to move up/down/left/right.
normal-mode.start-move.up=^{arrowmod} +up | _{up} -edge | _{enabledoubletap} +e
normal-mode.start-move.down=^{arrowmod} +down | _{down} -edge | _{enabledoubletap} +d
normal-mode.start-move.left=^{arrowmod} +left | _{left} -edge | _{enabledoubletap} +s
normal-mode.start-move.right=^{arrowmod} +right | _{right} -edge | _{enabledoubletap} +f
# Stop moving by releasing direction keys.
# If the edge/grid/hint/screenselection key is pressed, then stop moving.
normal-mode.stop-move.up=-up | #edge | +grid | ^{enabledoubletap} +hint | +screenselection | -e | -enabledoubletap
normal-mode.stop-move.down=-down | #edge | +grid | ^{enabledoubletap} +hint | +screenselection | -d | -enabledoubletap
normal-mode.stop-move.left=-left | #edge | +grid | ^{enabledoubletap} +hint | +screenselection | -s | -enabledoubletap
normal-mode.stop-move.right=-right | #edge | +grid | ^{enabledoubletap} +hint | +screenselection | -f | -enabledoubletap
# Register leftctrl to allow ctrl-clicking.
normal-mode.press.left=_{none | leftctrl} +leftbutton | _{none | leftctrl} +clickthendisable
normal-mode.press.middle=+middlebutton
normal-mode.press.right=_{none | leftctrl} +rightbutton
normal-mode.release.left=-leftbutton
normal-mode.release.middle=-middlebutton
normal-mode.release.right=-rightbutton
normal-mode.toggle.left=_{none | leftctrl} +toggleleft
normal-mode.start-wheel.up=^{enabledoubletap} +wheelup
normal-mode.start-wheel.down=^{enabledoubletap} +wheeldown
normal-mode.start-wheel.left=+wheelleft
normal-mode.start-wheel.right=+wheelright
normal-mode.stop-wheel.up=-wheelup
normal-mode.stop-wheel.down=-wheeldown
normal-mode.stop-wheel.left=-wheelleft
normal-mode.stop-wheel.right=-wheelright

# Eat the fast and superslow key presses to prevent them from reaching apps.
# Eat the slow key press (leftshift) only when scrolling vertically to prevent horizontal scroll behavior in certain apps.
normal-mode.noop.eatspeedmods=_{wheelup | wheeldown} +slow | +fast | +superslow

# Snap to screen edges.
normal-mode.to.edge-mode=#edge
edge-mode.noop.eatspeedmods=+slow | +fast | +superslow
edge-mode.to.normal-mode=-edge
edge-mode.indicator=normal-mode.indicator
edge-mode.mouse=normal-mode.mouse
edge-mode.press=normal-mode.press
edge-mode.release=normal-mode.release
edge-mode.toggle=normal-mode.toggle
# Invisible grid used for snapping/attaching to the screen's edges.
edge-mode.overlay.area=active-screen
edge-mode.overlay.area-width-percent=0.80
edge-mode.overlay.area-height-percent=0.95
edge-mode.overlay.grid-cell-sizing=fit
edge-mode.overlay.grid-max-row-count=1
edge-mode.overlay.grid-max-column-count=1
edge-mode.overlay.visible=false
edge-mode.overlay.mouse-follows-target=false
edge-mode.overlay.target-follows-overlay-center=false
edge-mode.move-to.cell-top=+up | _{up} +edge
edge-mode.move-to.cell-bottom=+down | _{down} +edge
edge-mode.move-to.cell-left=+left | _{left} +edge
edge-mode.move-to.cell-right=+right | _{right} +edge

# Grid is enabled with y (without Shift), disabled with y or esc.
# Press direction keys to shrink the grid in one direction.
normal-mode.to.grid-mode=^{windowmod} +grid
grid-mode.to.normal-mode=+grid | +esc
grid-mode.to.idle-mode=+exit
grid-mode.indicator=normal-mode.indicator
grid-mode.overlay.area=active-screen
grid-mode.overlay.area-width-percent=0.99
grid-mode.overlay.area-height-percent=0.99
grid-mode.overlay.grid-cell-sizing=fit
grid-mode.overlay.grid-max-row-count=2
grid-mode.overlay.grid-max-column-count=2
grid-mode.overlay.visible=true
grid-mode.overlay.mouse-follows-target=true
grid-mode.overlay.target-follows-overlay-center=true
grid-mode.overlay.box-color=#FF0000
grid-mode.overlay.box-opacity=0.1
grid-mode.overlay.box-border-color=#FF0000
grid-mode.overlay.box-border-opacity=1
grid-mode.shrink-overlay.up=+up
grid-mode.shrink-overlay.down=+down
grid-mode.shrink-overlay.left=+left
grid-mode.shrink-overlay.right=+right

# Window mode is enabled by holding windowmod (leftshift) and pressing the grid key (y).
# It is exited as soon as windowmod is released.
# Move to the active window's edges with direction keys.
# Move to the active window's center with the grid key (y).
normal-mode.noop.eatwindowmod=+windowmod
normal-mode.to.window-mode=_{windowmod} +grid
window-mode.to.normal-mode=-windowmod
window-mode.indicator=normal-mode.indicator
window-mode.overlay.area=active-window
# Top inset to be able to quickly access a window's title bar (and potentially grab it and move the window).
window-mode.overlay.area-top-inset=15
window-mode.overlay.grid-cell-sizing=fit
window-mode.overlay.grid-max-row-count=1
window-mode.overlay.grid-max-column-count=1
window-mode.overlay.visible=true
window-mode.overlay.mouse-follows-target=true
window-mode.overlay.target-follows-overlay-center=true
window-mode.overlay.box-color=#FF0000
window-mode.overlay.box-opacity=0.1
window-mode.overlay.box-border-color=#FF0000
window-mode.overlay.box-border-opacity=1
window-mode.move-to.cell-top=+up
window-mode.move-to.cell-bottom=+down
window-mode.move-to.cell-left=+left
window-mode.move-to.cell-right=+right
window-mode.move-to.overlay-center=+grid

# Drill-down hints. One letter per cell; the next grid is drawn only inside the cell just chosen.
# 12 keys fill a 3x4 grid, in the same order as the left-hand block:
#   q w e r
#   a s d f
#   z x c v
# Sub-cell letters stay hidden until that cell is selected. Three presses land the pointer.
# Caps Lock must not be held, and Shift must not be held (Shift+F is UI hints).
normal-mode.to.hint1-mode=^{uihintmod enabledoubletap} +hint

hint1-mode.to.normal-mode=+esc | +backspace
hint1-mode.to.hint2-mode=_{none | hint2mod} +extendedhint1key
hint1-mode.break-combo-preparation=+extendedhint1key
hint1-mode.hide-cursor.enabled=true
hint1-mode.overlay.type=grid
hint1-mode.overlay.area=active-screen
hint1-mode.overlay.area-center=active-screen-center
hint1-mode.overlay.grid-cell-sizing=fit
hint1-mode.overlay.grid-max-row-count=3
hint1-mode.overlay.grid-max-column-count=4
hint1-mode.overlay.layout-row-count=3
hint1-mode.overlay.layout-column-count=4
hint1-mode.overlay.selection-keys=hint1key
hint1-mode.select=_{none | hint2mod} +extendedhint1key
hint1-mode.deselect=+backspace
hint1-mode.overlay.mouse-follows-target=true
hint1-mode.overlay.target-follows-overlay-center=true
hint1-mode.overlay.font-name=Segoe UI
hint1-mode.overlay.font-size=72
hint1-mode.overlay.font-color=#FFFFFF
hint1-mode.overlay.font-shadow-color=#000000
hint1-mode.overlay.font-shadow-opacity=1
hint1-mode.overlay.font-shadow-blur-radius=8
hint1-mode.overlay.box-color=#000000
hint1-mode.overlay.box-opacity=0.18
hint1-mode.overlay.box-border-color=#FFFFFF
hint1-mode.overlay.box-border-thickness=2
hint1-mode.overlay.box-border-opacity=0.9
hint1-mode.overlay.prefix-box-enabled=false
hint1-mode.overlay.prefix-in-background=false
# 1x1 leaves the inner grid undrawn. The next mode shows it after a key is pressed.
hint1-mode.overlay.subdecoration-max-row-count=1
hint1-mode.overlay.subdecoration-max-column-count=1

hint2-mode.hide-cursor=hint1-mode.hide-cursor
hint2-mode.overlay=hint1-mode.overlay
hint2-mode.select=hint1-mode.select
hint2-mode.deselect=hint1-mode.deselect
hint2-mode.break-combo-preparation=+extendedhint1key
hint2-mode.overlay.area=last-selected-hint-cell
hint2-mode.overlay.area-center=last-selected-hint
hint2-mode.overlay.area-width-percent=1
hint2-mode.overlay.area-height-percent=1
hint2-mode.overlay.font-size=36
hint2-mode.to.hint1-mode=+backspace
hint2-mode.to.hint3-mode=_{none | hint2mod} +extendedhint1key
hint2-mode.to.normal-mode=+esc

hint3-mode.hide-cursor=hint1-mode.hide-cursor
hint3-mode.overlay=hint2-mode.overlay
hint3-mode.select=hint1-mode.select
hint3-mode.deselect=hint1-mode.deselect
hint3-mode.break-combo-preparation=+extendedhint1key
hint3-mode.overlay.font-size=18
hint3-mode.to.hint2-mode=+backspace
hint3-mode.to.normal-mode=+esc | _{none | hint2mod} +extendedhint1key

# Screen selection is enabled with c, disabled with c or esc.
normal-mode.to.screen-selection-mode=+screenselection
screen-selection-mode.to.normal-mode=+screenselection | +esc | +backspace | +hintscreenselectionkey
screen-selection-mode.break-combo-preparation=+hintscreenselectionkey
screen-selection-mode.to.idle-mode=+exit
screen-selection-mode.overlay.type=grid
screen-selection-mode.overlay.area=all-screens
screen-selection-mode.overlay.grid-max-row-count=1
screen-selection-mode.overlay.grid-max-column-count=1
screen-selection-mode.overlay.selection-keys=hintscreenselectionkey
screen-selection-mode.overlay.font-size=120

# UI hints: hold Shift and press the hint key (e.g. Shift+F). With Caps Lock as double-tap key, use Caps+Shift+F from idle.
normal-mode.to.ui-hint-mode=+uihintmod +hint | _{uihintmod} +hint
ui-hint-mode.to.idle-mode=+esc | +backspace | +hint1key
ui-hint-mode.to.normal-mode=+hint1key
ui-hint-mode.break-combo-preparation=+hint1key
ui-hint-mode.indicator=normal-mode.indicator
ui-hint-mode.overlay.type=ui-accessibility
ui-hint-mode.overlay.selection-keys=hint1key
ui-hint-mode.select=+hint1key
ui-hint-mode.deselect=+backspace
ui-hint-mode.overlay.font-size=10
ui-hint-mode.overlay.font-weight=bold
ui-hint-mode.overlay.font-color=#000000
ui-hint-mode.overlay.selected-font-color=#616161
ui-hint-mode.overlay.font-shadow-opacity=0
ui-hint-mode.overlay.box-color=#FFEB3B
ui-hint-mode.overlay.box-opacity=1
ui-hint-mode.overlay.box-horizontal-padding=1
ui-hint-mode.overlay.box-vertical-padding=0
ui-hint-mode.overlay.center-offset-x=10
ui-hint-mode.overlay.box-border-opacity=1
ui-hint-mode.overlay.box-border-radius=3
ui-hint-mode.overlay.background-opacity=0.2

# Remappings.
normal-mode.macro.navigateback=+navigateback -> +leftalt +leftarrow -leftarrow -leftalt
normal-mode.macro.navigateforward=+navigateforward -> +leftalt +rightarrow -rightarrow -leftalt

idle-mode.macro=_arrowremapping-mode.macro
normal-mode.macro=_arrowremapping-mode.macro
key-alias.arrowextramod=leftshift leftctrl leftwin
_arrowremapping-mode.macro.pressarrow=\
  +arrowmod {#*arrowextramod?} +arrowkey | _{arrowmod | arrowmod arrowextramod} +arrowkey \
  -> arrowkey=uparrow downarrow leftarrow rightarrow \
  -> -arrowmod +arrowkey
_arrowremapping-mode.macro.releasearrow=_{arrowmod} -arrowkey \
  -> arrowkey=uparrow downarrow leftarrow rightarrow \
  -> -arrowkey
_arrowremapping-mode.macro.releaseallarrows=_{arrowkey} -arrowmod -> -uparrow -leftarrow -downarrow -rightarrow
key-alias.arrowhandledkey=arrowkey arrowextramod enabledoubletap
_arrowremapping-mode.macro.repressalt=_{arrowmod} ^{arrowkey} #!arrowhandledkey -> +arrowmod

idle-mode.to.begin-alt-tab-mode=_{leftalt} #tab
normal-mode.to.begin-alt-tab-mode=_{leftalt} #tab
# The Alt Tab menu process name is Explorer.EXE.
# We want to center the mouse on the active window as soon as the Alt Tab menu is not
# the active window anymore.
# 1. Wait for the release of leftalt.
begin-alt-tab-mode.to.end-alt-tab-mode=-leftalt
# 2.a Wait for Explorer.EXE to lose focus.
end-alt-tab-mode.to.center-on-active-window-mode=^{Explorer.EXE}
# 2.b Fallback: if Explorer.EXE is still active 2000ms after leftalt release, go back.
end-alt-tab-mode.to.previous-mode-from-history-stack=#{*}-2000
# 3. Center the mouse on the (newly) active window, then switch back.
center-on-active-window-mode.overlay.area=active-window
center-on-active-window-mode.overlay.visible=false
center-on-active-window-mode.overlay.grid-cell-sizing=fit
center-on-active-window-mode.overlay.grid-max-row-count=1
center-on-active-window-mode.overlay.grid-max-column-count=1
center-on-active-window-mode.overlay.mouse-follows-target=true
center-on-active-window-mode.overlay.target-follows-overlay-center=true
# Immediately switch back to previous mode after centering the mouse.
center-on-active-window-mode.to.previous-mode-from-history-stack=wait-0
