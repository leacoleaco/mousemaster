normal-mode.cheatsheet-indicator.font-name=Microsoft YaHei UI
normal-mode.cheatsheet-indicator.font-size=12
normal-mode.cheatsheet-indicator.border-radius=14
normal-mode.cheatsheet-indicator.fill-color=#1A1B26
normal-mode.cheatsheet-indicator.fill-opacity=0.95
normal-mode.cheatsheet-indicator.stroke-thickness=1
normal-mode.cheatsheet-indicator.stroke-color=#FFFFFF
normal-mode.cheatsheet-indicator.stroke-opacity=0.14

# Clear mode: F opens accessibility hints (the system UI tree). Each tag has a class,
# which is its color and what choosing it does:
#   点击类 click   the pointer moves there and nothing is clicked: button, link,
#                  menu item, checkbox, radio button, tab, list / tree / data item,
#                  and anything else the app says reacts to a click.
#   输入类 input   clicked, then mousemaster leaves to idle so the next keys type into it:
#                  edit, combo box, spinner
#   控件类 widget  operated with keys of its own, shown in a panel at the pointer: scroll bar
#   其他类 other   only pointed at: the pointer moves there and nothing is clicked
# I opens the same hints already filtered to the input class.
# Precise mode: R opens vision hints (what is drawn on screen). They have no class,
# so they are only pointed at. R again cycles two other features, then the first.
# F opens accessibility hints. Shift and Left Ctrl must not be held.
# I and R still require Shift and Caps Lock to be up.
normal-mode.to.ui-hint-mode=^{uihintmod leftctrl} +hint
normal-mode.to.input-hint-mode=^{uihintmod capslock} +i
normal-mode.to.vision-hint-mode=^{uihintmod capslock} +precise
ui-hint-mode.to.idle-mode=+backspace
ui-hint-mode.to.normal-mode=+esc | _{isoverlayempty}
# The last key of a tag chooses it. ui-hint-selected-mode then goes where its class says.
ui-hint-mode.to.ui-hint-selected-mode=+hint1key
ui-hint-mode.break-combo-preparation=+hint1key
ui-hint-mode.indicator=normal-mode.indicator
ui-hint-mode.overlay.type=ui-accessibility
# The window under the pointer, including one that does not have focus.
ui-hint-mode.overlay.area=mouse-window
ui-hint-mode.overlay.ui-order=mouse
ui-hint-mode.overlay.selection-keys=hint1key
ui-hint-mode.select=+hint1key
ui-hint-mode.deselect=+backspace
ui-hint-mode.overlay.font-size=10
ui-hint-mode.overlay.font-weight=bold
ui-hint-mode.overlay.font-color=#000000
ui-hint-mode.overlay.selected-font-color=#616161
ui-hint-mode.overlay.font-shadow-opacity=0
# The tag's color is its class: yellow click, green input, orange widget, gray other.
# box-color is a tag with no class (vision hints set their own).
# One control can still get a color of its own with <control>-box-color, such as
# ui-hint-mode.overlay.checkbox-box-color=#CE93D8 (see the configuration reference).
ui-hint-mode.overlay.box-color=#FFEB3B
ui-hint-mode.overlay.click-box-color=#FFEB3B
ui-hint-mode.overlay.input-box-color=#A5D6A7
ui-hint-mode.overlay.widget-box-color=#FFB74D
ui-hint-mode.overlay.other-box-color=#BDBDBD
ui-hint-mode.overlay.box-opacity=1
ui-hint-mode.overlay.box-horizontal-padding=1
ui-hint-mode.overlay.box-vertical-padding=0
ui-hint-mode.overlay.center-offset-x=10
ui-hint-mode.overlay.box-border-opacity=1
ui-hint-mode.overlay.box-border-radius=3
ui-hint-mode.overlay.background-opacity=0.2
# g / t / b filter the hints to one class. Typing a hint key still selects, without filtering.
# Entering the mode clears the previous filter. The menu sits above the cursor,
# and its cells use the same colors as the click, input and widget tags. A dot marks the active filter.
ui-hint-mode.reset-variables=wait-0
ui-hint-mode.filter-ui-hints.click=+g
ui-hint-mode.filter-ui-hints.input=+t
ui-hint-mode.filter-ui-hints.widget=+b
ui-hint-mode.set-variable.uihintclick=+g
ui-hint-mode.set-variable.uihintinput=+t
ui-hint-mode.set-variable.uihintwidget=+b
ui-hint-mode.unset-variable.uihintclick=+t | +b
ui-hint-mode.unset-variable.uihintinput=+g | +b
ui-hint-mode.unset-variable.uihintwidget=+g | +t
ui-hint-mode.filter-indicator.shape=rectangle
ui-hint-mode.filter-indicator.position=mouse
ui-hint-mode.filter-indicator.y=-52
ui-hint-mode.filter-indicator.z=2
ui-hint-mode.filter-indicator.border-radius=6
ui-hint-mode.filter-indicator.font-name=Microsoft YaHei UI
ui-hint-mode.filter-indicator.font-size=13
ui-hint-mode.filter-indicator.font-weight=bold
ui-hint-mode.filter-indicator.fill-color=#FFFFFF
ui-hint-mode.filter-indicator.fill-opacity=1
ui-hint-mode.filter-indicator.stroke-thickness=1
ui-hint-mode.filter-indicator.stroke-color=#000000
ui-hint-mode.filter-indicator.stroke-opacity=1
ui-hint-mode.filter-indicator.text-style-sheet=td { color: #000000; padding: 3px 8px; }
ui-hint-mode.filter-indicator.text=<table cellspacing=0 cellpadding=0><tr>\
<td bgcolor="#FFEB3B">点击类（g）</td><td bgcolor="#A5D6A7">输入类（t）</td><td bgcolor="#FFB74D">控件类（b）</td></tr></table> \
| _{uihintclick} -> <table cellspacing=0 cellpadding=0><tr>\
<td bgcolor="#FFEB3B">● 点击类（g）</td><td bgcolor="#A5D6A7">输入类（t）</td><td bgcolor="#FFB74D">控件类（b）</td></tr></table> \
| _{uihintinput} -> <table cellspacing=0 cellpadding=0><tr>\
<td bgcolor="#FFEB3B">点击类（g）</td><td bgcolor="#A5D6A7">● 输入类（t）</td><td bgcolor="#FFB74D">控件类（b）</td></tr></table> \
| _{uihintwidget} -> <table cellspacing=0 cellpadding=0><tr>\
<td bgcolor="#FFEB3B">点击类（g）</td><td bgcolor="#A5D6A7">输入类（t）</td><td bgcolor="#FFB74D">● 控件类（b）</td></tr></table>

# Vision hints have no class. The menu is hidden; g/t/b are ignored here, and a
# chosen tag is only pointed at. R is not a label. Each press replaces the tags
# with a different feature: regions, then straight colour boundaries (horizontal
# and vertical), then large regular blanks. The third press returns to the regions.
# A new tag does not sit on one already shown in this round.
# The shared parent has no R transition, so a later pass does not inherit the earlier one.
_vision-hint-mode=ui-hint-mode
_vision-hint-mode.to.normal-mode=+esc
_vision-hint-mode.filter-indicator.enabled=false
_vision-hint-mode.overlay.type=ui-vision
_vision-hint-mode.overlay.selection-keys=visionhintkey
_vision-hint-mode.overlay.box-color=#4DD0E1
_vision-hint-mode.select=+visionhintkey
_vision-hint-mode.to.ui-hint-selected-mode=+visionhintkey
_vision-hint-mode.break-combo-preparation=+visionhintkey
_vision-hint-mode.pass-indicator.shape=rectangle
_vision-hint-mode.pass-indicator.position=mouse
_vision-hint-mode.pass-indicator.y=-36
_vision-hint-mode.pass-indicator.z=2
_vision-hint-mode.pass-indicator.border-radius=6
_vision-hint-mode.pass-indicator.font-name=Microsoft YaHei UI
_vision-hint-mode.pass-indicator.font-size=13
_vision-hint-mode.pass-indicator.font-weight=bold
_vision-hint-mode.pass-indicator.fill-color=#FFFFFF
_vision-hint-mode.pass-indicator.fill-opacity=1
_vision-hint-mode.pass-indicator.stroke-thickness=1
_vision-hint-mode.pass-indicator.stroke-color=#000000
_vision-hint-mode.pass-indicator.stroke-opacity=1
_vision-hint-mode.pass-indicator.text-style-sheet=td { color: #000000; padding: 3px 8px; }
_vision-hint-mode.pass-indicator.text=<table cellspacing=0 cellpadding=0><tr><td bgcolor="#4DD0E1">第 1/3 次：区域，再按 r</td></tr></table>

vision-hint-mode=_vision-hint-mode
vision-hint-mode.overlay.vision-density=6
vision-hint-mode.overlay.vision-refine=0
vision-hint-mode.to.vision-hint-2-mode=+precise

vision-hint-2-mode=_vision-hint-mode
vision-hint-2-mode.overlay.vision-density=8
vision-hint-2-mode.overlay.vision-refine=1
vision-hint-2-mode.to.vision-hint-3-mode=+precise
vision-hint-2-mode.pass-indicator.text=<table cellspacing=0 cellpadding=0><tr><td bgcolor="#4DD0E1">第 2/3 次：直线中点</td></tr></table>

vision-hint-3-mode=_vision-hint-mode
vision-hint-3-mode.overlay.vision-density=8
vision-hint-3-mode.overlay.vision-refine=2
vision-hint-3-mode.to.vision-hint-mode=+precise
vision-hint-3-mode.pass-indicator.text=<table cellspacing=0 cellpadding=0><tr><td bgcolor="#4DD0E1">第 3/3 次：空白区域，再按 r 回到区域</td></tr></table>

# I: the accessibility hints, already filtered to the input class. The menu shows
# 输入类 highlighted. g / t / b still switch the filter. A chosen tag does what its
# class says, as in ui-hint-mode: an input is clicked and mousemaster leaves to idle.
input-hint-mode.indicator=ui-hint-mode.indicator
input-hint-mode.overlay=ui-hint-mode.overlay
input-hint-mode.select=ui-hint-mode.select
input-hint-mode.deselect=ui-hint-mode.deselect
input-hint-mode.break-combo-preparation=ui-hint-mode.break-combo-preparation
input-hint-mode.to.idle-mode=+backspace
input-hint-mode.to.normal-mode=+esc
input-hint-mode.to.ui-hint-selected-mode=+hint1key
input-hint-mode.filter-ui-hints.click=+g
input-hint-mode.filter-ui-hints.input=+t | wait-0
input-hint-mode.filter-ui-hints.widget=+b
input-hint-mode.set-variable.uihintclick=+g
input-hint-mode.set-variable.uihintinput=+t | wait-0
input-hint-mode.set-variable.uihintwidget=+b
input-hint-mode.unset-variable.uihintclick=+t | +b | wait-0
input-hint-mode.unset-variable.uihintinput=+g | +b
input-hint-mode.unset-variable.uihintwidget=+g | +t | wait-0

# A tag was chosen and the pointer is going to it. This mode lasts one frame: it reads
# the class of the chosen tag (isselectedhintclick / input / widget / other) and leaves
# for the mode of that class. A widget is told apart by its control, such as
# isselectedhintscrollbar. A click-class tag is only pointed at.
# Only an input is clicked, and then mousemaster leaves to idle.
# A widget with no key mode of its own yet (a slider) is only
# pointed at, like the other class: give it a mode by adding a line here.
ui-hint-selected-mode.indicator=normal-mode.indicator
ui-hint-selected-mode.to.click-hint-mode=_{isselectedhintclick} wait-0
ui-hint-selected-mode.to.click-input-mode=_{isselectedhintinput} wait-0
ui-hint-selected-mode.to.scroll-bar-mode=_{isselectedhintscrollbar} wait-0
ui-hint-selected-mode.to.normal-mode=_{isselectedhintother} wait-0 \
  | ^{isselectedhintscrollbar} _{isselectedhintwidget} wait-0

# 点击类: the pointer snaps onto the control. Nothing is clicked.
click-hint-mode.indicator=normal-mode.indicator
click-hint-mode.mouse.smooth-jump-enabled=false
click-hint-mode.to.normal-mode=wait-0

# 输入类: the pointer is on the field. Snap there, click, then leave to idle.
click-input-mode.mouse.smooth-jump-enabled=false
click-input-mode.press.left=wait-0
click-input-mode.release.left=wait-20
click-input-mode.to.idle-mode=wait-30

# 控件类 · 滚动条: the pointer is on the scroll bar and the keys below turn the wheel
# there, so what the bar belongs to scrolls without pressing the bar and dragging.
# The keys follow the bar that was chosen: isselectedhintvertical is pressed for a
# vertical bar, which takes scrollbarup / scrollbardown, and isselectedhinthorizontal
# for a horizontal one, which takes scrollbarleft / scrollbarright. Change the keys
# in the key-alias.scrollbar* lines at the top, or the combos here.
# Hold fast / slow / superslow for the speed, as in normal mode.
# Esc goes back to normal mode, the exit key leaves, and the hint key shows the tags again.
scroll-bar-mode.indicator=normal-mode.indicator
# The panel is where normal mode draws its scroll arrow, which follows other keys.
scroll-bar-mode.scroll-indicator.enabled=false
scroll-bar-mode.mouse.smooth-jump-enabled=false
scroll-bar-mode.wheel=normal-mode.wheel
scroll-bar-mode.start-wheel.up=_{isselectedhintvertical} +scrollbarup
scroll-bar-mode.start-wheel.down=_{isselectedhintvertical} +scrollbardown
scroll-bar-mode.start-wheel.left=_{isselectedhinthorizontal} +scrollbarleft
scroll-bar-mode.start-wheel.right=_{isselectedhinthorizontal} +scrollbarright
scroll-bar-mode.stop-wheel.up=-scrollbarup
scroll-bar-mode.stop-wheel.down=-scrollbardown
scroll-bar-mode.stop-wheel.left=-scrollbarleft
scroll-bar-mode.stop-wheel.right=-scrollbarright
# The keys of the other direction do nothing, rather than being typed into the app.
scroll-bar-mode.noop.eatotherdirection=_{isselectedhintvertical} +scrollbarleft \
  | _{isselectedhintvertical} +scrollbarright \
  | _{isselectedhinthorizontal} +scrollbarup \
  | _{isselectedhinthorizontal} +scrollbardown
scroll-bar-mode.noop.eatspeedmods=+slow | +fast | +superslow
scroll-bar-mode.to.normal-mode=+esc
scroll-bar-mode.to.idle-mode=+exit
scroll-bar-mode.to.ui-hint-mode=^{uihintmod leftctrl} +hint
# The panel above the pointer lists the keys of the chosen bar.
scroll-bar-mode.keys-indicator.shape=rectangle
scroll-bar-mode.keys-indicator.position=mouse
scroll-bar-mode.keys-indicator.y=-52
scroll-bar-mode.keys-indicator.z=2
scroll-bar-mode.keys-indicator.border-radius=6
scroll-bar-mode.keys-indicator.font-name=Microsoft YaHei UI
scroll-bar-mode.keys-indicator.font-size=13
scroll-bar-mode.keys-indicator.font-weight=bold
scroll-bar-mode.keys-indicator.fill-color=#FFFFFF
scroll-bar-mode.keys-indicator.fill-opacity=1
scroll-bar-mode.keys-indicator.stroke-thickness=1
scroll-bar-mode.keys-indicator.stroke-color=#000000
scroll-bar-mode.keys-indicator.stroke-opacity=1
scroll-bar-mode.keys-indicator.text-style-sheet=td { color: #000000; padding: 3px 8px; }
scroll-bar-mode.keys-indicator.text=<table cellspacing=0 cellpadding=0><tr>\
<td bgcolor="#FFB74D">滚动条</td><td>{scrollbarup} 上</td><td>{scrollbardown} 下</td>\
<td>{fast} 快</td><td>{slow} 慢</td><td>Esc 返回</td></tr></table> \
| _{isselectedhinthorizontal} -> <table cellspacing=0 cellpadding=0><tr>\
<td bgcolor="#FFB74D">滚动条</td><td>{scrollbarleft} 左</td><td>{scrollbarright} 右</td>\
<td>{fast} 快</td><td>{slow} 慢</td><td>Esc 返回</td></tr></table>

# Remappings.
# p pastes into the focused control. Other keys must be up, so Ctrl+P still reaches the app.
normal-mode.macro.paste=_{none} +paste -> +leftctrl +v -v -leftctrl
zoom-mode.macro.paste=_{none} +paste -> +leftctrl +v -v -leftctrl
normal-mode.macro.navigateback=+navigateback -> +leftalt +leftarrow -leftarrow -leftalt
normal-mode.macro.navigateforward=+navigateforward -> +leftalt +rightarrow -rightarrow -leftalt

idle-mode.macro=_arrowremapping-mode.macro
normal-mode.macro=_arrowremapping-mode.macro
key-alias.arrowextramod=leftshift leftctrl leftwin
_arrowremapping-mode.macro.pressarrow=\
  +arrowmod {#*arrowextramod?} +arrowkey | _{arrowmod | arrowmod arrowextramod} +arrowkey \
  -> arrowkey=uparrow downarrow leftarrow rightarrow \
  -> -arrowmod +arrowkey
_arrowremapping-mode.macro.releasearrow=_{arrowmod} -arrowkey \
  -> arrowkey=uparrow downarrow leftarrow rightarrow \
  -> -arrowkey
_arrowremapping-mode.macro.releaseallarrows=_{arrowkey} -arrowmod -> -uparrow -leftarrow -downarrow -rightarrow
key-alias.arrowhandledkey=arrowkey arrowextramod capslock
_arrowremapping-mode.macro.repressalt=_{arrowmod} ^{arrowkey} #!arrowhandledkey -> +arrowmod

idle-mode.to.begin-alt-tab-mode=_{leftalt} #tab
normal-mode.to.begin-alt-tab-mode=_{leftalt} #tab
# The Alt Tab menu process name is Explorer.EXE.
# We want to center the mouse on the active window as soon as the Alt Tab menu is not
# the active window anymore.
# 1. Wait for the release of leftalt.
begin-alt-tab-mode.to.end-alt-tab-mode=-leftalt
# 2.a Wait for Explorer.EXE to lose focus.
end-alt-tab-mode.to.center-on-active-window-mode=^{Explorer.EXE}
# 2.b Fallback: if Explorer.EXE is still active 2000ms after leftalt release, go back.
end-alt-tab-mode.to.previous-mode-from-history-stack=#{*}-2000
# 3. Center the mouse on the (newly) active window, then switch back.
center-on-active-window-mode.overlay.area=active-window
center-on-active-window-mode.overlay.visible=false
center-on-active-window-mode.overlay.grid-cell-sizing=fit
center-on-active-window-mode.overlay.grid-max-row-count=1
center-on-active-window-mode.overlay.grid-max-column-count=1
center-on-active-window-mode.overlay.mouse-follows-target=true
center-on-active-window-mode.overlay.target-follows-overlay-center=true
# Immediately switch back to previous mode after centering the mouse.
center-on-active-window-mode.to.previous-mode-from-history-stack=wait-0
