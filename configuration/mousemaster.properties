# mousemaster will automatically convert the key aliases to your current keyboard layout.
# However, if you want to make a change to the key aliases, and your keyboard layout
# is not us-qwerty, then remove .us-qwerty
# Double-tap left Ctrl, or either Shift, to enter normal mode from idle.
# The key must be tapped twice itself (see idle-mode.double-tap-to-normal.*).
key-alias.enabledoubletap.us-qwerty=leftctrl leftshift rightshift
key-alias.exit.us-qwerty=q
key-alias.paste.us-qwerty=p
key-alias.clickthendisable.us-qwerty=space
key-alias.up.us-qwerty=k
key-alias.down.us-qwerty=j
key-alias.left.us-qwerty=h
key-alias.right.us-qwerty=l
# Hold either Shift and e/d/s/f move the pointer the way k/j/h/l do.
# Release Shift and those keys go back to scrolling and hints.
# s alone lists windows (Alt-Tab order). a alone opens the menu of the program in front.
# b alone opens the window menu (Alt+Space), then leaves mouse mode the way q does.
# b still speeds movement when another key is held.
key-alias.handmove.us-qwerty=leftshift rightshift
key-alias.handup.us-qwerty=e
key-alias.handdown.us-qwerty=d
key-alias.handleft.us-qwerty=s
key-alias.handright.us-qwerty=f
key-alias.handdirection.us-qwerty=e d s f
key-alias.edge.us-qwerty=rightalt
key-alias.wheelup.us-qwerty=e
key-alias.wheeldown.us-qwerty=d
key-alias.wheelleft.us-qwerty=u
key-alias.wheelright.us-qwerty=o
key-alias.leftbutton.us-qwerty=g
key-alias.rightbutton.us-qwerty=t
key-alias.middlebutton.us-qwerty=0
key-alias.toggleleft.us-qwerty=n
key-alias.fast.us-qwerty=b
key-alias.slow.us-qwerty=c
key-alias.superslow.us-qwerty=leftshift
# y copies the text under the pointer. Shift+y is still the active-window grid.
key-alias.copy.us-qwerty=y
key-alias.windowmod.us-qwerty=leftshift
key-alias.hint.us-qwerty=f
# R alone opens vision hints. Shift+R opens the letter grid.
# Shift+F moves the pointer right, so the grid is not on F.
key-alias.precise.us-qwerty=r
key-alias.hint2mod.us-qwerty=leftshift
# F alone opens accessibility hints. Shift+F moves the pointer right.
key-alias.uihintmod.us-qwerty=leftshift rightshift
# Hold M or Z to magnify around the cursor.
key-alias.zoom.us-qwerty=m z
key-alias.cheatsheet.us-qwerty=f1
key-alias.screenselection.us-qwerty=v
key-alias.navigateback.us-qwerty=[
key-alias.navigateforward.us-qwerty=]
# The keys that scroll once a scroll bar's tag was chosen (see scroll-bar-mode).
# A vertical bar takes up and down, a horizontal bar left and right.
key-alias.scrollbarup.us-qwerty=k
key-alias.scrollbardown.us-qwerty=j
key-alias.scrollbarleft.us-qwerty=h
key-alias.scrollbarright.us-qwerty=l
#key-alias.hint1key.us-qwerty=q w e r t a s d f g z x c v b y u i o p h j k l ; n m , . /
#key-alias.hint2key.us-qwerty=q w e r u i o p a s d f j k l ; z x c v m , . /
#key-alias.extendedhint1key.us-qwerty=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ; z x c v b n m , . /
#key-alias.extendedhint2key.us-qwerty=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ; z x c v b n m , . /
key-alias.hint1key.us-qwerty=q w e r a s d f z x c v
key-alias.hint2key.us-qwerty=q w e r a s d f z x c v
key-alias.extendedhint1key.us-qwerty=q w e r a s d f z x c v
key-alias.extendedhint2key.us-qwerty=q w e r a s d f z x c v
# Vision hints label with these letters. R cycles three features, then back to the first.
key-alias.visionhintkey.us-qwerty=q w e a s d f z x c v
# Left-hand letters only. Screens are labeled left to right: F, then D, then S, then A...
# V opens and cancels screen selection, Q exits, so neither is a screen letter.
key-alias.hintscreenselectionkey.us-qwerty=f d s a g e w r c x z t b
# The letters beside the rows of the window list (s) and of a program menu (a). Pressing
# one chooses its row at once: the window is focused, the menu item is run.
# The rows take them from the top down, in this order:
# left-hand letters, the ones a finger reaches with the least movement first.
# e, d and g are not here, because in those lists they move the highlight and confirm.
# To tag with one of them, also take it out of select-window / select-menu-item below.
key-alias.menutag.us-qwerty=f c a w v r x q z t b
key-alias.arrowmod.us-qwerty=leftalt
key-alias.arrowkey.us-qwerty=up down left right
# Either Shift. Used by shortcuts that belong to one program.
key-alias.chromeshift=leftshift rightshift
# Executable names. Add another program here when it needs its own shortcuts.
app-alias.chrome=chrome.exe
app-alias.cursor=Cursor.exe cursor.exe

idle-mode.push-mode-to-history-stack=true
normal-mode.push-mode-to-history-stack=true

# Enter normal mode by double-tapping left Ctrl or either Shift (fast, within max-millis-between-taps).
# That double-tap shows the cursor spotlight. The same double-tap, while already out of idle, shows it again.
# Optional: leading-debounce-millis avoids accidental re-trigger after the combo completes.
idle-mode.double-tap-to-normal.key-alias=enabledoubletap
idle-mode.double-tap-to-normal.max-millis-between-taps=400
idle-mode.double-tap-to-normal.leading-debounce-millis=200
idle-mode.double-tap-to-normal.target-mode=normal-mode

normal-mode.indicator.enabled=true
normal-mode.indicator.fill-color=#FF0000 | _{ismoving} -> #FF0000 | _{iswheeling} -> #FFFF00 | _{ismousepressing} -> #00FF00
# White box, black letters, above the cursor. Move and wheel stay color-only.
normal-mode.action-indicator.enabled=false | _{ismousepressing} -> true
normal-mode.action-indicator.shape=rectangle
normal-mode.action-indicator.border-radius=4
normal-mode.action-indicator.z=1
normal-mode.action-indicator.y=-40
normal-mode.action-indicator.font-name=Segoe UI
normal-mode.action-indicator.font-size=13
normal-mode.action-indicator.font-weight=bold
normal-mode.action-indicator.fill-color=#FFFFFF
normal-mode.action-indicator.fill-opacity=1
normal-mode.action-indicator.stroke-thickness=1
normal-mode.action-indicator.stroke-color=#000000
normal-mode.action-indicator.stroke-opacity=1
normal-mode.action-indicator.text-style-sheet=td { color: #000000; padding: 4px 8px; }
# Shown above the cursor for one second after a copy.
copied-hint-animation.duration-millis=1000
normal-mode.copied-indicator.enabled=false | _{copiedhintanimation} -> true
normal-mode.copied-indicator.shape=rectangle
normal-mode.copied-indicator.border-radius=4
normal-mode.copied-indicator.z=2
normal-mode.copied-indicator.y=-40
normal-mode.copied-indicator.font-name=Microsoft YaHei UI
normal-mode.copied-indicator.font-size=13
normal-mode.copied-indicator.font-weight=bold
normal-mode.copied-indicator.fill-color=#FFFFFF
normal-mode.copied-indicator.fill-opacity=1
normal-mode.copied-indicator.stroke-thickness=1
normal-mode.copied-indicator.stroke-color=#000000
normal-mode.copied-indicator.stroke-opacity=1
normal-mode.copied-indicator.text-style-sheet=td { color: #000000; padding: 4px 8px; }
normal-mode.copied-indicator.text=<table cellspacing=0 cellpadding=0><tr><td>已复制</table>
# Keys that are not a mouse-mode command are swallowed, the way Vim ignores
# unmapped keys in normal mode. A note sits above the cursor for one second,
# or until a command key (space, a move key, and so on) is pressed.
# Ctrl, Alt, and Win chords are still delivered to the focused program.
activemode-tip-animation.duration-millis=1000
# Unbound letters and symbols are swallowed. Digits, Enter, and arrows are not.
normal-mode.eat-unhandled-key-press=true
normal-mode.unhandled-key-press-animation=activemode-tip-animation
normal-mode.activemode-tip-indicator.enabled=false | _{activemodetipanimation} -> true
normal-mode.activemode-tip-indicator.shape=rectangle
normal-mode.activemode-tip-indicator.border-radius=4
normal-mode.activemode-tip-indicator.z=2
normal-mode.activemode-tip-indicator.y=-40
normal-mode.activemode-tip-indicator.font-name=Microsoft YaHei UI
normal-mode.activemode-tip-indicator.font-size=13
normal-mode.activemode-tip-indicator.font-weight=bold
normal-mode.activemode-tip-indicator.fill-color=#FFFFFF
normal-mode.activemode-tip-indicator.fill-opacity=1
normal-mode.activemode-tip-indicator.stroke-thickness=1
normal-mode.activemode-tip-indicator.stroke-color=#000000
normal-mode.activemode-tip-indicator.stroke-opacity=1
normal-mode.activemode-tip-indicator.text-style-sheet=td { color: #000000; padding: 4px 8px; }
normal-mode.activemode-tip-indicator.text=<table cellspacing=0 cellpadding=0><tr><td>现在处于激活模式，请先取消激活才能输入。</table>
normal-mode.action-indicator.text= \
  | _{isleftmousepressing} -> <table cellspacing=0 cellpadding=0><tr><td>left click</table> \
  | _{ismiddlemousepressing} -> <table cellspacing=0 cellpadding=0><tr><td>middle click</table> \
  | _{isrightmousepressing} -> <table cellspacing=0 cellpadding=0><tr><td>right click</table>
# Arrow above the cursor while scrolling. It points with the wheel and has no text.
# Drawn pointing up, then turned. e/d scroll only when Ctrl is not held.
normal-mode.scroll-indicator.enabled=false | _{iswheeling} -> true
normal-mode.scroll-indicator.shape=path
normal-mode.scroll-indicator.points=0.5,0 1,0.42 0.68,0.42 0.68,1 0.32,1 0.32,0.42 0,0.42
normal-mode.scroll-indicator.size=22
normal-mode.scroll-indicator.z=1
normal-mode.scroll-indicator.y=-42
normal-mode.scroll-indicator.fill-color=#FFFFFF
normal-mode.scroll-indicator.fill-opacity=1
normal-mode.scroll-indicator.stroke-thickness=2
normal-mode.scroll-indicator.stroke-color=#000000
normal-mode.scroll-indicator.stroke-opacity=1
normal-mode.scroll-indicator.rotation=0 \
  | ^{leftctrl} _{wheelup} -> 0 \
  | ^{leftctrl} _{wheeldown} -> 180 \
  | _{wheelleft} -> -90 \
  | _{wheelright} -> 90 \
  | ^{leftctrl} _{wheelup wheelright} -> 45 \
  | ^{leftctrl} _{wheeldown wheelright} -> 135 \
  | ^{leftctrl} _{wheeldown wheelleft} -> -135 \
  | ^{leftctrl} _{wheelup wheelleft} -> -45
# The following keys can be used to go back to idle mode:
# exit key (q), b alone (after Alt+Space), click-then-disable key (space), f2, f3, /.
# p pastes (Ctrl+V) instead of exiting.
# Ctrl plus any key is left to the app.
normal-mode.to.idle-mode=+exit | -clickthendisable \
  | #f2 | #f3 | #/ \
  | ^{up down left right handmove handup handdown handleft handright wheelleft wheelright slow superslow} _{none} +fast
normal-mode.mouse.initial-velocity=200
# Left Shift still makes k/j/h/l extremely slow. Shift+e/d/s/f keep the normal speed,
# and c / b still make that movement slow / fast.
normal-mode.mouse.max-velocity=2200 | _{slow} ^{superslow} -> 350 | _{fast} -> 4500 \
  | _{superslow} ^{handdirection} -> 75 \
  | _{handdirection slow} ^{fast} -> 350 \
  | _{handdirection fast} -> 4500
normal-mode.mouse.acceleration=1000 | _{fast} -> 5000
normal-mode.wheel.initial-velocity=1500
normal-mode.wheel.max-velocity=2000 | _{slow} ^{superslow} -> 200 | _{fast} -> 10000 | _{superslow} -> 50
normal-mode.wheel.acceleration=500 | _{fast} -> 10000
# Start moving with direction keys.
# When releasing the edge key, if direction keys are already pressed then start moving.
# Hold Shift and e/d/s/f move too: e up, d down, s left, f right, same as k/j/h/l.
# Releasing Shift, or releasing that letter, stops the direction. k/j/h/l keep moving
# if they are still held. Ctrl plus any key, including e/d/s/f, is passed through.
normal-mode.start-move.up=^{arrowmod} +up | _{up} -edge | ^{arrowmod} _{handmove} +handup | ^{arrowmod} _{handup} +handmove
normal-mode.start-move.down=^{arrowmod} +down | _{down} -edge | ^{arrowmod} _{handmove} +handdown | ^{arrowmod} _{handdown} +handmove
normal-mode.start-move.left=^{arrowmod} +left | _{left} -edge | ^{arrowmod} _{handmove} +handleft | ^{arrowmod} _{handleft} +handmove
normal-mode.start-move.right=^{arrowmod} +right | _{right} -edge | ^{arrowmod} _{handmove} +handright | ^{arrowmod} _{handright} +handmove
# Stop moving by releasing direction keys.
# If the edge/copy/hint/screenselection key is pressed, then stop moving.
# F is a direction while Shift is held, so it must not stop movement then.
# R opens the letter grid, so it stops movement.
normal-mode.stop-move.up=^{handmove} -up | ^{handup} -up | _{handmove} ^{up} -handup | _{handup} ^{up} -handmove | #edge | +copy | ^{leftctrl handmove} +hint | ^{leftctrl} +precise | +screenselection
normal-mode.stop-move.down=^{handmove} -down | ^{handdown} -down | _{handmove} ^{down} -handdown | _{handdown} ^{down} -handmove | #edge | +copy | ^{leftctrl handmove} +hint | ^{leftctrl} +precise | +screenselection
normal-mode.stop-move.left=^{handmove} -left | ^{handleft} -left | _{handmove} ^{left} -handleft | _{handleft} ^{left} -handmove | #edge | +copy | ^{leftctrl handmove} +hint | ^{leftctrl} +precise | +screenselection
normal-mode.stop-move.right=^{handmove} -right | ^{handright} -right | _{handmove} ^{right} -handright | _{handright} ^{right} -handmove | #edge | +copy | ^{leftctrl handmove} +hint | ^{leftctrl} +precise | +screenselection
# Keyboard clicks require no other key, so Ctrl+G and similar chords stay system
# shortcuts. A physical mouse button still ctrl-clicks, because Ctrl is not swallowed.
# G holds the left button only while G is down. Shift+G toggles it the way n does.
# shiftgtoggle remembers that this G press was the toggle, so releasing G leaves
# the button where the toggle put it. A drag that started on G alone still ends
# when G is released, even if Shift was pressed afterwards.
normal-mode.press.left=^{handmove} _{none} +leftbutton | _{none} +clickthendisable
normal-mode.press.middle=+middlebutton
normal-mode.press.right=_{none} +rightbutton
normal-mode.release.left=^{shiftgtoggle} -leftbutton
normal-mode.release.middle=-middlebutton
normal-mode.release.right=-rightbutton
normal-mode.toggle.left=_{none} +toggleleft | _{handmove} +leftbutton
virtual-key.shiftgtoggle=released
normal-mode.macro.markshiftgtoggle=_{handmove} +leftbutton -> #shiftgtoggle
normal-mode.macro.clearshiftgtoggle=_{shiftgtoggle} -leftbutton -> ~shiftgtoggle
# e/d scroll only when Shift is not held. While Shift is held they move the pointer.
normal-mode.start-wheel.up=^{leftctrl handmove} +wheelup
normal-mode.start-wheel.down=^{leftctrl handmove} +wheeldown
normal-mode.start-wheel.left=+wheelleft
normal-mode.start-wheel.right=+wheelright
normal-mode.stop-wheel.up=-wheelup | _{wheelup} +handmove
normal-mode.stop-wheel.down=-wheeldown | _{wheeldown} +handmove
normal-mode.stop-wheel.left=-wheelleft
normal-mode.stop-wheel.right=-wheelright

# Eat the fast and superslow key presses to prevent them from reaching apps.
# Eat the release of b as well, so a tap that opens the system menu is not also typed.
# Eat the slow key press (leftshift) only when scrolling vertically to prevent horizontal scroll behavior in certain apps.
# Eat Shift, and the release of e/d/s/f, so a hand-move chord is not typed into the app.
normal-mode.noop.eatspeedmods=_{wheelup | wheeldown} +slow | +fast | -fast | +superslow
normal-mode.noop.eathandmove=+handmove | -handmove
normal-mode.noop.releasehandkeys=-handup | -handdown | -handleft | -handright
# Left Shift is already eaten above. Eat Right Shift in Chrome too, so a tab
# shortcut is not delivered with Shift still held.
normal-mode.noop.eatchromeshift=_{chrome} +rightshift

# Hold M or Z to magnify around the cursor. Release it to return.
# Movement and scrolling stay available, at a lower speed so the view stays controllable.
normal-mode.to.zoom-mode=+zoom
zoom-mode.to.normal-mode=-zoom
zoom-mode.to.idle-mode=+exit | -clickthendisable \
  | #f2 | #f3 | #/
zoom-mode.indicator=normal-mode.indicator
zoom-mode.eat-unhandled-key-press=normal-mode.eat-unhandled-key-press
zoom-mode.unhandled-key-press-animation=normal-mode.unhandled-key-press-animation
zoom-mode.mouse=normal-mode.mouse
zoom-mode.mouse.initial-velocity=80
zoom-mode.mouse.max-velocity=500 | _{slow} ^{superslow} -> 150 | _{fast} -> 1200 \
  | _{superslow} ^{handdirection} -> 40 \
  | _{handdirection slow} ^{fast} -> 150 \
  | _{handdirection fast} -> 1200
zoom-mode.mouse.acceleration=400 | _{fast} -> 1500
zoom-mode.wheel=normal-mode.wheel
zoom-mode.wheel.initial-velocity=400
zoom-mode.wheel.max-velocity=600 | _{slow} ^{superslow} -> 80 | _{fast} -> 2500 | _{superslow} -> 30
zoom-mode.wheel.acceleration=300 | _{fast} -> 2500
zoom-mode.start-move=normal-mode.start-move
zoom-mode.stop-move=normal-mode.stop-move
zoom-mode.press=normal-mode.press
zoom-mode.release=normal-mode.release
zoom-mode.toggle=normal-mode.toggle
zoom-mode.macro.markshiftgtoggle=_{handmove} +leftbutton -> #shiftgtoggle
zoom-mode.macro.clearshiftgtoggle=_{shiftgtoggle} -leftbutton -> ~shiftgtoggle
zoom-mode.start-wheel=normal-mode.start-wheel
zoom-mode.stop-wheel=normal-mode.stop-wheel
zoom-mode.noop=normal-mode.noop
zoom-mode.zoom.percent=4
zoom-mode.zoom.center=mouse
zoom-mode.zoom.transition-enabled=true
zoom-mode.zoom.transition-duration-millis=180

# Snap to screen edges.
normal-mode.to.edge-mode=#edge
edge-mode.noop.eatspeedmods=+slow | +fast | +superslow
edge-mode.to.normal-mode=-edge
edge-mode.indicator=normal-mode.indicator
edge-mode.eat-unhandled-key-press=normal-mode.eat-unhandled-key-press
edge-mode.unhandled-key-press-animation=normal-mode.unhandled-key-press-animation
edge-mode.mouse=normal-mode.mouse
edge-mode.press=normal-mode.press
edge-mode.release=normal-mode.release
edge-mode.toggle=normal-mode.toggle
edge-mode.macro.markshiftgtoggle=_{handmove} +leftbutton -> #shiftgtoggle
edge-mode.macro.clearshiftgtoggle=_{shiftgtoggle} -leftbutton -> ~shiftgtoggle
# Invisible grid used for snapping/attaching to the screen's edges.
edge-mode.overlay.area=active-screen
edge-mode.overlay.area-width-percent=0.80
edge-mode.overlay.area-height-percent=0.95
edge-mode.overlay.grid-cell-sizing=fit
edge-mode.overlay.grid-max-row-count=1
edge-mode.overlay.grid-max-column-count=1
edge-mode.overlay.visible=false
edge-mode.overlay.mouse-follows-target=false
edge-mode.overlay.target-follows-overlay-center=false
edge-mode.move-to.cell-top=+up | _{up} +edge
edge-mode.move-to.cell-bottom=+down | _{down} +edge
edge-mode.move-to.cell-left=+left | _{left} +edge
edge-mode.move-to.cell-right=+right | _{right} +edge

# Copy the text under the pointer. Each tap is a press and release of y, without Shift.
# One tap waits to see that no further tap is coming, then copies the word.
# Two taps copy the line. Three taps copy the whole document.
# A control that exposes its text is read and selected that way, and the text is
# placed on the clipboard. Anywhere that does not, one tap double-clicks, two taps
# triple-click, and three taps click once, press Ctrl+A, then Ctrl+C.
# The 400 is the gap, in milliseconds, allowed between taps.
normal-mode.copy-text.word=^{windowmod} #!{copy}-400 +copy -copy-400
normal-mode.copy-text.line=^{windowmod} #!{copy}-400 +copy -copy-0-400 +copy -copy-400
normal-mode.copy-text.all=^{windowmod} #!{copy}-400 +copy -copy-0-400 +copy -copy-0-400 +copy -copy
normal-mode.break-combo-preparation=^{windowmod} #!{copy}-400 +copy -copy-0-400 +copy -copy-0-400 +copy -copy
zoom-mode.copy-text=normal-mode.copy-text
zoom-mode.break-combo-preparation=normal-mode.break-combo-preparation

# Window mode is enabled by holding windowmod (leftshift) and pressing y.
# It is exited as soon as windowmod is released.
# Move to the active window's edges with direction keys.
# Move to the active window's center with y.
normal-mode.noop.eatwindowmod=+windowmod
normal-mode.to.window-mode=_{windowmod} +copy
window-mode.to.normal-mode=-windowmod
window-mode.indicator=normal-mode.indicator
window-mode.eat-unhandled-key-press=normal-mode.eat-unhandled-key-press
window-mode.unhandled-key-press-animation=normal-mode.unhandled-key-press-animation
window-mode.overlay.area=active-window
# Top inset to be able to quickly access a window's title bar (and potentially grab it and move the window).
window-mode.overlay.area-top-inset=15
window-mode.overlay.grid-cell-sizing=fit
window-mode.overlay.grid-max-row-count=1
window-mode.overlay.grid-max-column-count=1
window-mode.overlay.visible=true
window-mode.overlay.mouse-follows-target=true
window-mode.overlay.target-follows-overlay-center=true
window-mode.overlay.box-color=#FF0000
window-mode.overlay.box-opacity=0.1
window-mode.overlay.box-border-color=#FF0000
window-mode.overlay.box-border-opacity=1
window-mode.move-to.cell-top=+up
window-mode.move-to.cell-bottom=+down
window-mode.move-to.cell-left=+left
window-mode.move-to.cell-right=+right
window-mode.move-to.overlay-center=+copy

# s alone lists windows in Alt-Tab order (the active window first, then the previous one).
# The highlight starts on the previous window, so g, space, or Enter jumps there the way one Alt-Tab does.
# e or k moves up the list, d or j moves down, g, space, or Enter jumps, Esc returns here.
# Each row is the program icon, centered beside the window title with the process name under it.
# The rows of the first page have a letter in front (see key-alias.menutag). Pressing it
# jumps to that row's window at once. The first row is the window already in front:
# its letter still jumps there, and a smaller 当前 follows that letter.
# g returns straight to activation mode. Space and a row's letter wait until the key is
# released, then return there too (see window-switch-done-mode).
# Holding A still uses s to move left, and Ctrl+S is left to the app.
# After the jump, the pointer is centered on that window, then this mode returns.
normal-mode.to.window-switch-mode=^{handmove leftctrl} _{none} +handleft
window-switch-mode.push-mode-to-history-stack=false
window-switch-mode.stop-commands-from-previous-mode=true
window-switch-mode.to.normal-mode=+esc
window-switch-mode.select-window.previous=+handup | +up
window-switch-mode.select-window.next=+handdown | +down
window-switch-mode.activate-window.center-on-active-window-mode=+leftbutton | +enter | +numpadenter
window-switch-mode.activate-window.window-switch-done-mode=+clickthendisable
window-switch-mode.activate-window.tag-keys.window-switch-done-mode=menutag
window-switch-mode.noop.eatrelease=-handup | -handdown | -up | -down | -leftbutton | -clickthendisable | -enter | -numpadenter | -esc | -handleft | -menutag
window-switch-mode.indicator=normal-mode.indicator
window-switch-mode.eat-unhandled-key-press=normal-mode.eat-unhandled-key-press
window-switch-mode.unhandled-key-press-animation=normal-mode.unhandled-key-press-animation
window-switch-mode.menu-indicator.enabled=true
window-switch-mode.menu-indicator.follow=false
window-switch-mode.menu-indicator.position=active-screen-center
window-switch-mode.menu-indicator.shape=rectangle
window-switch-mode.menu-indicator.z=5
window-switch-mode.menu-indicator.border-radius=14
window-switch-mode.menu-indicator.font-name=Microsoft YaHei UI
window-switch-mode.menu-indicator.font-size=15
window-switch-mode.menu-indicator.font-weight=bold
window-switch-mode.menu-indicator.fill-color=#1A1B26
window-switch-mode.menu-indicator.fill-opacity=0.96
window-switch-mode.menu-indicator.stroke-thickness=1
window-switch-mode.menu-indicator.stroke-color=#FFFFFF
window-switch-mode.menu-indicator.stroke-opacity=0.14
window-switch-mode.menu-indicator.text-style-sheet=\
td { color: #A9B1D6; } \
.title { color: #C0CAF5; font-size: large; padding: 12px 18px 4px 18px; } \
.hint { color: #7AA2F7; padding: 0 18px 8px 18px; } \
