window-switch-mode.menu-indicator.text=[[window-menu]]

# Space or a row's letter in the window list jumps, then this mode holds until that key
# is released and returns to activation mode. The release is consumed here: for space it
# is not the click-then-disable release that leaves activation mode, and a letter is not
# typed into the window that was just focused.
window-switch-done-mode.push-mode-to-history-stack=false
window-switch-done-mode.stop-commands-from-previous-mode=true
window-switch-done-mode.indicator=normal-mode.indicator
window-switch-done-mode.eat-unhandled-key-press=normal-mode.eat-unhandled-key-press
window-switch-done-mode.unhandled-key-press-animation=normal-mode.unhandled-key-press-animation
window-switch-done-mode.overlay=center-on-active-window-mode.overlay
window-switch-done-mode.to.normal-mode=-clickthendisable | -menutag

# a alone opens the menu of the program in front, drawn like the window list. Which menu
# depends on the program: each one is declared in the app-menu.* lines below, and a
# program that has none gets a note saying so.
# A row's own letter runs that item at once. Chrome's letters are written on its items
# below. k moves up and j moves down. e, d and g do that too, unless the open menu uses
# the key for a row, which Chrome does. Space or Enter runs the highlighted item.
# Esc returns here. Running an item sends the program the item's own shortcut, and
# releasing the key returns to activation mode.
# Shift, Ctrl, Alt and Win must be up, so Ctrl+A still selects everything and Win+A
# still belongs to Windows.
normal-mode.to.app-menu-mode=^{handmove leftctrl rightctrl leftalt rightalt leftwin rightwin} _{none} +a
app-menu-mode.push-mode-to-history-stack=false
app-menu-mode.stop-commands-from-previous-mode=true
app-menu-mode.to.normal-mode=+esc
app-menu-mode.select-menu-item.previous=+handup | +up
app-menu-mode.select-menu-item.next=+handdown | +down
app-menu-mode.run-menu-item.app-menu-done-mode=+leftbutton | +clickthendisable | +enter | +numpadenter
# The letters the menus write on their rows. A menu that does not give its rows their
# own letters takes these from the top down. A letter used by a row has to be here,
# or pressing it does nothing. c and s are Cursor's.
key-alias.appmenutag.us-qwerty=d f r x g b e w z c s
app-menu-mode.run-menu-item.tag-keys.app-menu-done-mode=appmenutag
app-menu-mode.noop.eatrelease=-handup | -handdown | -up | -down | -leftbutton | -clickthendisable | -enter | -numpadenter | -esc | -menutag | -appmenutag
app-menu-mode.eat-unhandled-key-press=normal-mode.eat-unhandled-key-press
app-menu-mode.unhandled-key-press-animation=normal-mode.unhandled-key-press-animation
# The panel is the window list's. Only what fills it differs.
app-menu-mode.indicator=window-switch-mode.indicator
app-menu-mode.menu-indicator.text=[[app-menu]]

# Once the item has run, this mode holds until the key that ran it is released, then
# returns to activation mode. There, g and space click when they go down, space leaves
# when it comes up, and a letter is a command of its own, so neither the press nor the
# release may reach activation mode.
app-menu-done-mode.push-mode-to-history-stack=false
app-menu-done-mode.stop-commands-from-previous-mode=true
app-menu-done-mode.indicator=normal-mode.indicator
app-menu-done-mode.eat-unhandled-key-press=normal-mode.eat-unhandled-key-press
app-menu-done-mode.unhandled-key-press-animation=normal-mode.unhandled-key-press-animation
# -appmenutag covers the row letters, including d and g, so -handdown and -leftbutton
# are not repeated here: one release must match only one combo.
app-menu-done-mode.to.normal-mode=-clickthendisable | -enter | -numpadenter | -appmenutag

# The menus. app-menu.<app alias>.item.<name>=<what the row says> -> <keys sent to the program>
# The keys are written like the output of a macro: +key presses, -key releases, wait-N
# waits N milliseconds, and 'text' is typed as it is, whatever the input method.
# The rows are in the order of these lines. A letter before the colon is that row's key.
# For another program, declare its executable with app-alias.<name>=<file name>, then its
# items with app-menu.<name>.item.*. A new letter also has to be added to appmenutag above,
# or pressing it does nothing.
# click 'Name' presses the button of that name. point 'Name' moves the pointer into the
# panel of that name. Keys written before point are sent first, so a view can be shown
# and then pointed at.
app-menu.chrome.title=Chrome
app-menu.chrome.item.previoustab=d: 上一个标签页 -> +leftctrl +rightshift +tab -tab -rightshift -leftctrl
app-menu.chrome.item.nexttab=f: 下一个标签页 -> +leftctrl +tab -tab -leftctrl
app-menu.chrome.item.reload=r: 刷新 -> +f5 -f5
app-menu.chrome.item.reopentab=x: 恢复上一个关闭的页面 -> +leftctrl +rightshift +t -t -rightshift -leftctrl
app-menu.chrome.item.google=g: 打开 Google -> +leftctrl +t -t -leftctrl wait-200 'https://www.google.com/' wait-50 +del -del +enter -enter
app-menu.chrome.item.baidu=b: 打开百度 -> +leftctrl +t -t -leftctrl wait-200 'https://www.baidu.com/' wait-50 +del -del +enter -enter
app-menu.chrome.item.back=e: 后退 -> +leftalt +leftarrow -leftarrow -leftalt
app-menu.chrome.item.forward=w: 前进 -> +leftalt +rightarrow -rightarrow -leftalt
app-menu.chrome.item.history=z: 历史 -> +leftctrl +h -h -leftctrl

# Cursor. x closes the current editor. f finds in the file.
# e clicks the New Agent button. c moves the pointer into the terminal panel.
# d shows source control and moves into it. s shows the file explorer and moves into it.
# The terminal is not toggled: that would hide it when it is already open.
app-menu.cursor.title=Cursor
app-menu.cursor.item.close=x: 关闭当前编辑窗 -> +leftctrl +w -w -leftctrl
app-menu.cursor.item.search=f: 搜索 -> +leftctrl +f -f -leftctrl
app-menu.cursor.item.newagent=e: New Agent -> click 'New Agent'
app-menu.cursor.item.terminal=c: Terminal -> point 'Terminal'
app-menu.cursor.item.git=d: Git -> +leftctrl +rightshift +g -g -rightshift -leftctrl point 'Source Control'
app-menu.cursor.item.project=s: 项目 -> +leftctrl +rightshift +e -e -rightshift -leftctrl point 'Files Explorer'

# Drill-down hints. One letter per cell; the next grid is drawn only inside the cell just chosen.
# 12 keys fill a 3x4 grid, in the same order as the left-hand block:
#   q w e r
#   a s d f
#   z x c v
# Sub-cell letters stay hidden until that cell is selected. Three presses land the pointer.
# Letter grid: hold either Shift and press R. Left Ctrl must not be held.
# Shift+F moves the pointer right, so this grid is not on F.
normal-mode.to.hint1-mode=^{leftctrl} +uihintmod +precise | ^{leftctrl} _{uihintmod} +precise

hint1-mode.to.normal-mode=+esc | +backspace
hint1-mode.to.hint2-mode=_{none | uihintmod} +extendedhint1key
hint1-mode.break-combo-preparation=+extendedhint1key
hint1-mode.hide-cursor.enabled=true
hint1-mode.overlay.type=grid
hint1-mode.overlay.area=active-screen
hint1-mode.overlay.area-center=active-screen-center
hint1-mode.overlay.grid-cell-sizing=fit
hint1-mode.overlay.grid-max-row-count=3
hint1-mode.overlay.grid-max-column-count=4
hint1-mode.overlay.layout-row-count=3
hint1-mode.overlay.layout-column-count=4
hint1-mode.overlay.selection-keys=hint1key
hint1-mode.select=_{none | uihintmod} +extendedhint1key
hint1-mode.deselect=+backspace
hint1-mode.overlay.mouse-follows-target=true
hint1-mode.overlay.target-follows-overlay-center=true
hint1-mode.overlay.font-name=Segoe UI
hint1-mode.overlay.font-size=72
hint1-mode.overlay.font-color=#FFFFFF
hint1-mode.overlay.font-opacity=0.9
hint1-mode.overlay.font-shadow-opacity=0
hint1-mode.overlay.box-color=#000000
hint1-mode.overlay.box-opacity=0.3
hint1-mode.overlay.box-border-color=#FFFFFF
hint1-mode.overlay.box-border-thickness=2
hint1-mode.overlay.box-border-opacity=0.9
hint1-mode.overlay.prefix-box-enabled=false
hint1-mode.overlay.prefix-in-background=false
# 1x1 leaves the inner grid undrawn. The next mode shows it after a key is pressed.
hint1-mode.overlay.subdecoration-max-row-count=1
hint1-mode.overlay.subdecoration-max-column-count=1

hint2-mode.hide-cursor=hint1-mode.hide-cursor
hint2-mode.overlay=hint1-mode.overlay
hint2-mode.select=hint1-mode.select
hint2-mode.deselect=hint1-mode.deselect
hint2-mode.break-combo-preparation=+extendedhint1key
hint2-mode.overlay.area=last-selected-hint-cell
hint2-mode.overlay.area-center=last-selected-hint
hint2-mode.overlay.area-width-percent=1
hint2-mode.overlay.area-height-percent=1
hint2-mode.overlay.font-size=36
hint2-mode.to.hint1-mode=+backspace
hint2-mode.to.hint3-mode=_{none | uihintmod} +extendedhint1key
hint2-mode.to.normal-mode=+esc

hint3-mode.hide-cursor=hint1-mode.hide-cursor
hint3-mode.overlay=hint2-mode.overlay
hint3-mode.select=hint1-mode.select
hint3-mode.deselect=hint1-mode.deselect
hint3-mode.break-combo-preparation=+extendedhint1key
hint3-mode.overlay.font-size=18
hint3-mode.to.hint2-mode=+backspace
hint3-mode.to.normal-mode=+esc | _{none | uihintmod} +extendedhint1key

# Screen selection is enabled with v. Each screen shows one left-hand letter
# (F, then D, then S, left to right). Press that letter to jump there.
# Disabled with v, esc, or backspace.
normal-mode.to.screen-selection-mode=+screenselection
screen-selection-mode.to.normal-mode=+screenselection | +esc | +backspace | +hintscreenselectionkey
screen-selection-mode.break-combo-preparation=+hintscreenselectionkey
screen-selection-mode.to.idle-mode=+exit
screen-selection-mode.overlay.type=grid
screen-selection-mode.overlay.area=all-screens
screen-selection-mode.overlay.grid-max-row-count=1
screen-selection-mode.overlay.grid-max-column-count=1
screen-selection-mode.overlay.selection-keys=hintscreenselectionkey
screen-selection-mode.overlay.font-size=120

