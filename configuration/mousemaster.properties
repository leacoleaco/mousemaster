zoom-hint3-mode=hint3-mode
zoom-hint3-mode.to.hint2-mode=none
zoom-hint3-mode.to.zoom-hint2-mode=+backspace
zoom-hint3-mode.zoom.area-size-source=last-selected-hint-cell
zoom-hint3-mode.zoom.center=last-selected-hint
zoom-hint3-mode.zoom.transition-enabled=true
